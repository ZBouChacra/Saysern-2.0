# The PUBLIC site: https://example.com   (static files from web/dist, and /api forwarded to the API)
# /etc/nginx/sites-available/sayserne-web  ->  symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/sayserne/web;
    index index.html;

    # uploads (photos up to a few MB, videos larger): keep this above the limits set in the back office (Media.*)
    client_max_body_size 120m;

    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # built files have a hash in their name: cache them for a long time; index.html must never be cached
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri /index.html; }   # the app handles its own routes (/search, /me ...)
}
